<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bottom Sheet Landing Proposal</title>
    <meta name="theme-color" content="#f8f9ff" />
    <style>
@font-face {
  font-family: 'Aeonik';
  src: url('fonts/Aeonik-Regular.otf') format('opentype');
  font-style: normal;
  font-weight: 400;
  font-display: swap;
}

@font-face {
  font-family: 'Aeonik';
  src: url('fonts/Aeonik-Medium.otf') format('opentype');
  font-style: normal;
  font-weight: 500;
  font-display: swap;
}

@font-face {
  font-family: 'Aeonik';
  src: url('fonts/Aeonik-Bold.otf') format('opentype');
  font-style: normal;
  font-weight: 700;
  font-display: swap;
}

/*
 * Scopes that keep their own colors in either theme redeclare the light tokens:
 * an app's screen looks the way that app looks, and navy blocks stay navy.
 */
:root,
.stage,
.trace,
.lanes {
  --grid-page: rgb(0 26 114 / 0.045);
  --grid-sheet: rgb(252 252 255 / 0.07);
  --sheet-sky: #e1f3fa;
  --sheet-ending: #fcfcff;
  --sky-offset: #b5e1f1;
  --sheet-shadow: 0 -18px 56px -6px rgb(0 26 114 / 0.42), 0 -3px 12px rgb(0 26 114 / 0.26);
  --dim: #001a72;
  --accent-on-sheet: #6fcef5;

  /* Brand palette, from docs/src/css/custom.css. */
  --navy: #001a72;
  --navy-deep: #001a72;
  --navy-80: #33488e;
  --navy-60: #6676aa;
  --navy-20: #c1c6e5;
  --navy-10: #eef0ff;
  --blue: #38acdd;
  --blue-bright: #6fcef5;
  --blue-20: #e1f3fa;
  --purple: #782aeb;
  --off-white: #f8f9ff;
  --white: #fcfcff;

  --sans: 'Aeonik', system-ui, -apple-system, sans-serif;
  --mono: SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;

  /*
   * The sheet's own critically damped spring (src/web/criticalSpring.ts),
   * sampled over its 450ms. Everything that moves in sympathy with a sheet
   * uses this, so the page and the product share one motion language.
   */
  --ease-sheet: linear(
    0, 0.0739, 0.2235, 0.3849, 0.5305, 0.6508, 0.7452, 0.8168, 0.8699, 0.9084,
    0.9361, 0.9557, 0.9694, 0.979, 0.9857, 0.9902, 0.9934, 0.9955, 1
  );
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);

  --gutter: clamp(20px, 4vw, 56px);
}

/* The hero's roles swap: a dark page with a light sheet rising over it. */
[data-theme='dark'] {
  color-scheme: dark;
  --grid-page: rgb(252 252 255 / 0.06);
  --grid-sheet: rgb(0 26 114 / 0.07);
  --accent-on-sheet: #126893;
  --sheet-sky: #001a72;
  --sheet-ending: #001a72;
  --sky-offset: #1b4865;
  --sheet-shadow: 0 -18px 56px -4px rgb(0 0 0 / 0.75), 0 -3px 12px rgb(0 0 0 / 0.5);
  --dim: black;
  --navy-deep: #122154;
  --navy: #eef0ff;
  --navy-80: #c1c6e5;
  --navy-60: #919fcf;
  --navy-20: #33488e;
  --navy-10: #1b2445;
  --off-white: #122154;
  --white: #1b2445;
  --blue: #6fcef5;
  --blue-20: #1b4865;
}

[data-theme='light'] {
  color-scheme: light;
}

[data-theme='dark'] .t-k {
  color: #d0b2ff;
}
[data-theme='dark'] .t-s {
  color: #6fcef5;
}
[data-theme='dark'] .t-n {
  color: #ffa3a1;
}

.stage,
.trace,
.lanes {
  color: var(--navy);
}

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  background: var(--navy-deep);
}

body {
  margin: 0;
  background: var(--navy-deep);
  color: var(--navy);
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

a {
  color: inherit;
}

h1,
h2,
h3,
p,
pre {
  margin: 0;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}

:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}

/* ---------- Pressables ---------- */

.press {
  transition: transform 160ms var(--ease-out);
}

.press:active {
  transform: scale(0.97);
}

.cta {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  height: 52px;
  padding: 0 22px;
  background: var(--navy);
  color: var(--white);
  font-weight: 500;
  text-decoration: none;
  white-space: nowrap;
}

.cta svg {
  transition: transform 200ms var(--ease-out);
}

@media (hover: hover) and (pointer: fine) {
  .cta:hover svg {
    transform: translateX(3px);
  }
}

.install {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  height: 52px;
  padding: 0 16px;
  border: 1px dashed currentColor;
  font-family: var(--mono);
  font-size: 13.5px;
  white-space: nowrap;
  max-width: 100%;
}

.install > span {
  overflow: hidden;
  text-overflow: ellipsis;
}

.icon-swap {
  position: relative;
  display: inline-block;
  width: 16px;
  height: 16px;
  flex: none;
}

.icon-swap svg {
  position: absolute;
  inset: 0;
  transition:
    opacity 180ms ease,
    filter 180ms ease,
    transform 180ms var(--ease-out);
}

.icon-swap svg:last-child {
  opacity: 0;
  filter: blur(2px);
  transform: scale(0.8);
}

[data-copied='true'] .icon-swap svg:first-child {
  opacity: 0;
  filter: blur(2px);
  transform: scale(0.8);
}

[data-copied='true'] .icon-swap svg:last-child {
  opacity: 1;
  filter: none;
  transform: none;
}

/* ---------- Header: measured from the Reanimated and Gesture Handler docs ---------- */

.navbar {
  position: absolute;
  z-index: 6;
  top: 0;
  left: 0;
  right: 0;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px 0 24px;
  color: var(--navy);
}

.brand {
  display: flex;
  align-items: center;
  gap: 18px;
  height: 40px;
  color: inherit;
  text-decoration: none;
}

.wordmark {
  white-space: nowrap;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  height: 36px;
  line-height: 1;
}

.wordmark span {
  font-size: 18px;
  font-weight: 400;
  letter-spacing: 0.115em;
  text-transform: uppercase;
}

.wordmark b {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: 0.01em;
}

.navbar-right {
  display: flex;
  align-items: center;
  gap: 24px;
}

.theme-toggle {
  display: flex;
  width: 72px;
  height: 36px;
  border: 1px solid currentColor;
  flex: none;
}

.theme-toggle span {
  flex: 1;
  display: grid;
  place-items: center;
}

.theme-toggle span[data-active='true'] {
  background: var(--navy);
  color: var(--off-white);
}

.navbar-github {
  display: grid;
  place-items: center;
  width: 48px;
  height: 32px;
  color: inherit;
  transition: opacity 160ms ease;
}

@media (hover: hover) and (pointer: fine) {
  .navbar-github:hover {
    opacity: 0.65;
  }
}

/* ---------- Hero ---------- */

.sheets {
  /* How much of the first section shows above the fold, inviting the scroll. */
  --peek: 56px;
  timeline-scope: --s1, --s2, --s3, --s4;
}

.hero {
  position: sticky;
  z-index: 0;
  top: 0;
  height: 100svh;
  min-height: 600px;
  background: var(--navy-deep);
}

.hero-stage {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: var(--off-white);
}

.world {
  position: absolute;
  inset: 0;
}

.world--light {
  z-index: 1;
  color: var(--navy);
  background-size: 44px 44px;
  background-position: center top;
  background-image:
    linear-gradient(var(--grid-page) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-page) 1px, transparent 1px);
}

.hero-surface {
  position: absolute;
  inset: 0;
  background-color: var(--navy);
  background-image:
    linear-gradient(var(--grid-sheet) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-sheet) 1px, transparent 1px);
  background-size: 44px 44px;
}

/* The library's content layer sits above the surface, so it needs the cursor too. */
.hero-grab {
  position: absolute;
  inset: 0;
}

.hero-grabber {
  width: 38px;
  height: 5px;
  margin: 10px auto 8px;
  border-radius: 3px;
  background: var(--white);
  opacity: 0.45;
}

/* Above the real sheet, so drags fall through to it everywhere but the buttons. */
.world--navy {
  z-index: 4;
  color: var(--white);
  /* Replaced per frame with the sheet's edge. */
  clip-path: inset(100% 0 0 0);
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
}

.world--navy .cta,
.world--navy .install,
.world--navy .callout {
  pointer-events: auto;
}

.world--navy .cta {
  background: var(--white);
  color: var(--navy);
}

.sheet-layer {
  position: absolute;
  z-index: 2;
  inset: 0;
  display: flex;
  /* The host is full-page: only the sheet itself should catch the pointer. */
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
}

.hero-copy {
  position: absolute;
  /* Just below the full detent, so the edge sweeps all of the copy. */
  top: max(92px, 11vh);
  left: var(--gutter);
  right: var(--gutter);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.hero-copy > * {
  animation: rise 500ms var(--ease-out) both;
  animation-delay: calc(var(--i) * 55ms);
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
}

.eyebrow {
  display: block;
  font-size: 17px;
  font-weight: 500;
  margin-bottom: 14px;
}

.hero h1 {
  margin: 0;
  font-size: inherit;
  font-weight: inherit;
}

.headline {
  display: block;
  font-size: min(8vw, 12vh, 112px);
  line-height: 0.98;
  letter-spacing: -0.035em;
  font-weight: 500;
  text-wrap: balance;
}

.lede {
  margin-top: 20px;
  max-width: 600px;
  font-size: clamp(17px, 2.2vh, 20px);
  line-height: 1.42;
  text-wrap: balance;
}

.hero-actions {
  margin-top: 24px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
}

/* Only exists under the sheet's edge: the blueprint of what you're dragging. */
.xray {
  position: absolute;
  left: 50%;
  bottom: calc(var(--peek) + 48px);
  width: min(620px, calc(100% - 2 * var(--gutter)));
  transform: translateX(-50%);
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 28px;
  font-size: 14.5px;
  line-height: 1.4;
}

.xray div {
  padding-top: 10px;
  border-top: 1px dashed color-mix(in srgb, currentColor 40%, transparent);
}

.xray b {
  display: block;
  margin-bottom: 3px;
  font-size: 12px;
  font-weight: 400;
  color: var(--accent-on-sheet);
}

.xray span {
  opacity: 0.8;
}

.readout {
  position: absolute;
  left: 0;
  right: 0;
  bottom: calc(var(--peek) + 18px);
  text-align: center;
  font-family: var(--mono);
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
  color: color-mix(in srgb, currentColor 72%, transparent);
}

.readout b {
  font-weight: 500;
  color: var(--accent-on-sheet);
}

.rule {
  position: absolute;
  left: 0;
  right: 0;
  height: 0;
  border-top: 1px dashed currentColor;
  opacity: 0.28;
  mask-image: linear-gradient(90deg, transparent 55%, black 92%);
}

.callout {
  position: absolute;
  right: var(--gutter);
  display: flex;
  align-items: center;
  gap: 8px;
  transform: translateY(-50%);
  font-size: 12px;
  white-space: nowrap;
}

.callout i {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1px solid currentColor;
  display: grid;
  place-items: center;
  font-style: normal;
  background: var(--off-white);
  transition:
    background-color 200ms ease,
    color 200ms ease;
}

.world--navy .callout i {
  background: var(--navy);
}

.callout span {
  opacity: 0.72;
}

.callout[aria-pressed='true'] i {
  background: var(--navy);
  border-color: var(--navy);
  color: var(--white);
}

.world--navy .callout[aria-pressed='true'] i {
  background: var(--white);
  border-color: var(--white);
  color: var(--navy);
}

.ride {
  position: absolute;
  z-index: 3;
  left: 0;
  right: 0;
  bottom: 0;
  height: 0;
  will-change: transform;
  pointer-events: none;
}

.hint {
  position: absolute;
  left: 50%;
  bottom: -68px;
  width: 112px;
  margin-left: -56px;
  height: 40px;
  border-radius: 20px;
  background: var(--white);
  color: var(--navy);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  font-size: 14px;
  font-weight: 500;
  transition:
    opacity 200ms ease,
    transform 200ms var(--ease-out);
  animation: nudge 1500ms var(--ease-in-out) 1400ms 3;
}

.hint[data-gone='true'] {
  opacity: 0;
  transform: translateY(6px) scale(0.96);
  animation: none;
}

@keyframes nudge {
  50% {
    transform: translateY(-6px);
  }
}

/* ---------- The stack: each section is a sheet rising over the last ---------- */

/*
 * On touch, native snapping does the job, and `always` means a hard flick can't
 * skip a section. Not with a wheel: it would fight the page's own stepping.
 */
@media (pointer: coarse) {
  html {
    scroll-snap-type: y mandatory;
  }

  .snap-top,
  .sentinel {
    scroll-snap-align: start;
    scroll-snap-stop: always;
  }
}

.snap-top {
  height: 0;
}

.sentinel {
  height: 100svh;
  margin-bottom: -100svh;
  visibility: hidden;
  pointer-events: none;
}

.sheet-section {
  position: sticky;
  /* The JS replaces this with the sticking offset of a tall section. */
  top: 0;
}

/* Every sheet starts over the one before it, so its top edge shows at the bottom. */
.sentinel {
  margin-top: calc(-1 * var(--peek));
}

.sheet-inner {
  position: relative;
  min-height: 100svh;
  overflow: hidden;
  border-radius: 32px 32px 0 0;
  box-shadow: inset 0 1px 0 var(--navy-20), var(--sheet-shadow);
  display: flex;
  flex-direction: column;
  background: var(--off-white);
}

/* The next sheet covers this much, so nothing here sits under it. */
.sheet-inner[data-recedes] {
  padding-bottom: var(--peek);
}

.sheet-inner[data-tone='sky'] {
  --offset-shadow: var(--sky-offset);
  background: var(--sheet-sky);
}

.sheet-inner[data-tone='ending'] {
  background: var(--sheet-ending);
}

.page-grabber {
  position: absolute;
  z-index: 1;
  top: 12px;
  left: 50%;
  width: 44px;
  height: 5px;
  margin-left: -22px;
  border-radius: 3px;
  background: var(--navy-20);
  transition: background-color 160ms ease;
}

/* The strip that shows when this sheet is next: drags the sheet between its stops. */
.sheet-handle {
  position: absolute;
  z-index: 9;
  top: 0;
  left: 0;
  right: 0;
  height: var(--peek);
  cursor: grab;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

@media (hover: hover) {
  .sheet-handle:hover .page-grabber {
    background: var(--navy-60);
  }
}

.sheet-dragging,
.sheet-dragging * {
  cursor: grabbing !important;
  user-select: none;
  -webkit-user-select: none;
}

/* What a sheet does to the screen beneath it, timed by the sheet that's rising. */
.hero-stage::after,
.sheet-inner::after {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 8;
  background: var(--dim);
  opacity: 0;
  pointer-events: none;
}

@supports (animation-timeline: view()) and (timeline-scope: --a) {
  @media (prefers-reduced-motion: no-preference) and (min-width: 861px) {
    .hero-stage,
    .sheet-inner[data-recedes] {
      animation: recede linear both;
      animation-timeline: var(--next);
      animation-range: entry var(--peek) entry 100%;
    }

    .hero-stage::after,
    .sheet-inner[data-recedes]::after {
      animation: dim linear both;
      animation-timeline: var(--next);
      animation-range: entry var(--peek) entry 100%;
    }
  }
}

@keyframes recede {
  to {
    transform: scale(0.94) translateY(-1.5%);
    border-radius: 28px;
  }
}

@keyframes dim {
  to {
    opacity: 0.45;
  }
}

.chapter {
  position: relative;
  flex: 1;
  width: 100%;
  max-width: 1320px;
  margin: 0 auto;
  padding: 64px var(--gutter) 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  column-gap: clamp(32px, 6vw, 96px);
  align-items: center;
}

/* Demo sheets rise from the section's own bottom edge. */
.chapter-copy {
  padding-bottom: 12px;
}

.chapter[data-flip] {
  grid-template-columns: auto minmax(0, 1fr);
}

.chapter[data-flip] .chapter-stage {
  order: -1;
}

.chapter-copy {
  max-width: 600px;
  min-width: 0;
}

.kicker {
  display: block;
  font-size: 12.5px;
  color: var(--navy-60);
  margin-bottom: 14px;
}

.title {
  font-size: clamp(36px, 4.4vw, 60px);
  line-height: 1.04;
  letter-spacing: -0.03em;
  font-weight: 500;
  text-wrap: balance;
}

code {
  font-family: var(--mono);
  font-size: 0.86em;
}

.body {
  margin-top: 16px;
  max-width: 520px;
  color: var(--navy-80);
  font-size: 18px;
  text-wrap: pretty;
}

/* Sections rise once. Decoration only: nothing waits for it. */
.reveal {
  transition:
    opacity 600ms ease,
    transform 700ms var(--ease-out);
}

.reveal[data-in='false'] {
  opacity: 0;
  transform: translateY(14px);
}

.chips {
  margin-top: 24px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chips-label {
  display: block;
  margin-top: 20px;
  font-size: 12.5px;
  color: var(--navy-60);
}

.chips-label + .chips {
  margin-top: 8px;
}

.chip {
  height: 38px;
  padding: 0 14px;
  border: 1px solid var(--navy-20);
  font-size: 14.5px;
  font-weight: 500;
  white-space: nowrap;
  transition:
    transform 160ms var(--ease-out),
    background-color 180ms ease,
    border-color 180ms ease,
    color 180ms ease;
}

.chip--mono {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 400;
}

@media (hover: hover) and (pointer: fine) {
  .chip:hover {
    border-color: var(--navy-60);
  }
}

.chip[aria-pressed='true'] {
  background: var(--navy);
  border-color: var(--navy);
  color: var(--white);
}

.code {
  position: relative;
  margin-top: 22px;
  padding: 18px 20px;
  background: var(--white);
  border: 1px solid var(--navy-20);
  box-shadow: 8px 8px 0 var(--offset-shadow, var(--blue-20));
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.65;
  overflow-x: auto;
  min-height: var(--code-h, auto);
}

.code pre {
  font: inherit;
}

.code-block {
  display: flex;
  flex-direction: column;
}

.code-toggle {
  display: none;
}

/* Below the code on wide screens, and beside its toggle on small ones. */
.code-actions {
  order: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 18px;
}

.docs-button {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 44px;
  padding: 0 16px;
  border: 1px solid var(--navy);
  color: var(--navy);
  font-size: 15px;
  font-weight: 500;
  text-decoration: none;
  white-space: nowrap;
  transition:
    transform 160ms var(--ease-out),
    background-color 180ms ease,
    color 180ms ease;
}

.docs-button svg {
  transition: transform 200ms var(--ease-out);
}

@media (hover: hover) and (pointer: fine) {
  .docs-button:hover {
    background: var(--navy);
    color: var(--off-white);
  }

  .docs-button:hover svg {
    transform: translateX(3px);
  }
}

/* Every variant shares one slot, so the copy around it never moves. */
.swap {
  display: grid;
  min-width: 0;
}

.swap-item {
  grid-area: 1 / 1;
  min-width: 0;
  opacity: 0;
  filter: blur(2px);
  visibility: hidden;
  transition:
    opacity 220ms ease,
    filter 220ms ease,
    visibility 0s linear 220ms;
}

.swap-item[data-on='true'] {
  opacity: 1;
  filter: none;
  visibility: visible;
  transition-delay: 0s;
}

.case-fade {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  animation: fade 240ms ease both;
}

.t-k {

}
.t-s {
  color: #126893;
}
.t-n {
  color: #914f55;
}
.t-c {

}
.t-j {

}

/* ---------- Stages: a host for a demo, with no device around it ---------- */

.chapter-stage {
  position: relative;
  /* The JS replaces this height, so the frame's top clears the copy's title. */
  align-self: end;
  width: min(500px, 40vw);
  height: min(680px, calc(100svh - 30px));
  margin-right: 76px;
}

.stage {
  /* Lets an app's screen size itself against the frame's height. */
  container-type: size;
  position: absolute;
  inset: 0;
  display: flex;
  overflow: hidden;
  border-radius: 28px 28px 0 0;
  background: #eef0ff;
  user-select: none;
  -webkit-user-select: none;
  isolation: isolate;
}

.backdrop {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.app-bar {

  justify-content: space-between;
  gap: 12px;

}

.app-bar-title {

  font-size: 14.5px;
  font-weight: 500;

}

.app-bar-title small {

  font-size: 11px;

/* Music player */
.backdrop--music {

}

.album {

  overflow: hidden;
  flex: none;
  align-self: center;
  /* Takes up what the frame has spare above the queue, instead of leaving a gap. */
  width: clamp(150px, calc(100cqh - 560px), min(72cqw, 340px));
  aspect-ratio: 1;
  margin-top: 2px;
  padding: 16px;
  border-radius: 16px;
  background: linear-gradient(160deg, #ff6259, #782aeb);
  box-shadow: 0 22px 44px -14px rgb(0 0 0 / 0.55);
  transform-origin: 50% 0;
}

.album span {

  font-size: clamp(22px, 13cqh / 3, 36px);
  font-weight: 500;
  line-height: 1;
  letter-spacing: -0.03em;
}

.album svg {

  right: 0;

}

.now-playing {

}

.now-playing b,
.now-playing span {

}

.now-playing b {

.now-playing span {

.track-bar {

.track-bar i {

.track-times {

}

.transport {

}

.transport-main {

/* Video page */
.backdrop--video {

.player {

}

.player > svg {

.player-controls {

.player-bottom {

.player-bar {

.channel {

.channel > i {

.channel div {

}

.channel b,

.channel b {

}

/* ---------- Rolling numbers ---------- */

.rolling {
  --roll-up: #31775d;
  --roll-down: #914f55;
  display: inline-flex;
  font-variant-numeric: tabular-nums;
  overflow: hidden;
  /* Room for descenders inside the clip. */
  line-height: 1.2;
}

.roll-char {
  position: relative;
  display: inline-block;
  white-space: pre;
  transition: color 700ms ease;
}

/* Aeonik's tabular digits still differ slightly, which would nudge the number on every roll. */
.roll-char[data-digit='true'] {
  width: 0.61em;
  text-align: center;
}

.roll-char[data-moving='true'][data-direction='up'] {
  color: var(--roll-up);
  transition-duration: 120ms;
}

.roll-char[data-moving='true'][data-direction='down'] {
  color: var(--roll-down);
  transition-duration: 120ms;
}

.roll-out {
  position: absolute;
  inset: 0;
}

.roll-in,
.roll-out {
  display: inline-block;
  animation-duration: 480ms;
  animation-timing-function: var(--ease-out);
  animation-delay: var(--roll-delay, 0ms);
  animation-fill-mode: both;
}

/* Rising digits travel up, falling digits travel down. */
[data-direction='up'] > .roll-in {
  animation-name: roll-in-up;
}

[data-direction='up'] > .roll-out {
  animation-name: roll-out-up;
}

[data-direction='down'] > .roll-in {
  animation-name: roll-in-down;
}

[data-direction='down'] > .roll-out {
  animation-name: roll-out-down;
}

@keyframes roll-in-up {
  from {
    transform: translateY(100%);
    opacity: 0;
  }
}

@keyframes roll-out-up {
  to {
    transform: translateY(-100%);
    opacity: 0;
  }
}

@keyframes roll-in-down {
  from {
    transform: translateY(-100%);
    opacity: 0;
  }
}

@keyframes roll-out-down {
  to {
    transform: translateY(100%);
    opacity: 0;
  }
}

.backdrop--portfolio .rolling {
  --roll-up: #a0dfc0;
  --roll-down: #ffb4b2;
}

.quote {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  color: var(--navy);
}

.quote-price {
  font-size: 15px;
  font-weight: 500;
}

.quote-change {
  margin-top: 1px;
  font-size: 13px;
  color: var(--navy-60);
}

.likes {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12.5px;
  color: var(--navy-60);
}

/* Portfolio */
.backdrop--portfolio {
  display: flex;
  flex-direction: column;
  color: var(--white);
  background: linear-gradient(180deg, #126893 0%, #1b4865 100%);
}

.backdrop--portfolio > strong {
  padding: 0 18px;
  font-size: clamp(36px, 3.6vw, 46px);
  line-height: 1.1;
  font-weight: 500;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}

.backdrop--portfolio > em {
  padding: 0 18px;
  font-style: normal;
  font-size: 13.5px;
  color: #a0dfc0;
}

.backdrop--portfolio > svg {
  display: block;
  flex: none;
  width: 100%;
  height: 180px;
  margin-top: 14px;
}

.ranges {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 8px 18px 0;
  font-size: 13.5px;
  color: rgb(252 252 255 / 0.6);
}

.ranges b {
  padding: 3px 12px;
  border-radius: 12px;
  background: rgb(252 252 255 / 0.14);
  color: var(--white);
  font-weight: 500;
}

.rail {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 100%;
  width: 76px;
  pointer-events: none;
}

.tick {
  position: absolute;
  left: 0;
  bottom: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  height: 0;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--navy-60);
  white-space: nowrap;
  animation: fade 300ms ease both;
  transition:
    transform 450ms var(--ease-sheet),
    color 180ms ease;
}

.tick::before {
  content: '';
  width: 14px;
  border-top: 1px solid currentColor;
}

.tick[data-active='true'] {
  color: var(--navy);
}

/* ---------- What makes a demo feel playable ---------- */

.grab {
  cursor: grab;
}

.grab:active {
  cursor: grabbing;
}

.sheet-body {
  position: relative;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.sheet-body--fill {
  flex: 1;
  min-height: 0;
}

.drag-hint {
  position: absolute;
  z-index: 1;
  top: 14px;
  right: 16px;
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
  font-weight: 500;
  color: var(--navy-60);
  pointer-events: none;
  transition:
    opacity 200ms ease,
    color 240ms ease;
}

.drag-hint[data-seen='true'] {
  opacity: 0;
}

.reopen {
  position: absolute;
  z-index: 1;
  left: 50%;
  bottom: 24px;
  height: 44px;
  padding: 0 18px;
  margin-left: -80px;
  min-width: 160px;
  background: var(--navy);
  color: var(--white);
  font-size: 14.5px;
  font-weight: 500;
  white-space: nowrap;
  transition:
    opacity 200ms ease,
    transform 200ms var(--ease-out);
}

.reopen[data-visible='false'] {
  opacity: 0;
  transform: translateY(6px) scale(0.97);
  pointer-events: none;
}

.reopen:active {
  transform: scale(0.97);
}

/* ---------- Negotiation trace ---------- */

.trace {
  margin-top: 22px;
  border: 1px solid var(--navy-20);
  background: var(--white);
  box-shadow: 8px 8px 0 var(--offset-shadow, var(--blue-20));
}

.trace canvas {
  display: block;
  width: 100%;
  height: 132px;
}

.trace-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 16px;
  align-items: center;
  padding: 10px 14px;
  border-top: 1px dashed var(--navy-20);
  font-size: 12px;
}

.trace-legend i {
  display: inline-block;
  width: 14px;
  height: 0;
  border-top: 2px solid;
  vertical-align: middle;
  margin-right: 6px;
}

.owner {
  margin-left: auto;
  padding: 2px 8px;
  background: var(--navy-10);
  transition:
    background-color 160ms ease,
    color 160ms ease;
}

.owner[data-owner='sheet'] {
  background: var(--navy);
  color: var(--white);
}

.owner[data-owner='list'] {
  background: var(--blue);
  color: var(--navy-deep);
}

.modes {
  display: flex;
  flex-wrap: wrap;
  column-gap: 28px;
}

.modes .chips-label {
  margin-top: 16px;
}

.modes .chips {
  flex-wrap: nowrap;
  gap: 4px;
}

.modes .chip {
  padding: 0 10px;
}

/* ---------- Threads ---------- */

.lanes {
  margin-top: 24px;
  border: 1px solid var(--navy-20);
  background: var(--white);
  box-shadow: 8px 8px 0 var(--offset-shadow, var(--blue-20));
}

.lane {
  display: grid;
  grid-template-columns: 128px minmax(0, 1fr) 40px;
  gap: 12px;
  align-items: center;
  padding: 12px 14px;
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
}

.lane + .lane {
  border-top: 1px dashed var(--navy-20);
}

.lane-track {
  position: relative;
  height: 22px;
  overflow: hidden;
}

.lane-track::before {
  content: '';
  position: absolute;
  inset: 0 -40px 0 0;
  background-image: repeating-linear-gradient(
    90deg,
    var(--tick) 0 3px,
    transparent 3px 20px
  );
  animation: ticks 700ms linear infinite;
  will-change: transform;
}

.lane[data-lane='ui'] .lane-track {
  --tick: var(--blue);
}

.lane[data-lane='js'] .lane-track {
  --tick: var(--navy);
}

@keyframes ticks {
  to {
    transform: translateX(-20px);
  }
}

.lanes[data-blocked='true'] .lane[data-lane='js'] .lane-track::before {
  animation-play-state: paused;
  opacity: 0.25;
}

.lane[data-lane='js'] .lane-track::after {
  content: 'blocked';
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--navy-deep);
  background: repeating-linear-gradient(
    135deg,
    rgb(255 98 89 / 0.28) 0 6px,
    rgb(255 98 89 / 0.1) 6px 12px
  );
  opacity: 0;
  transition: opacity 160ms ease;
}

.lanes[data-blocked='true'] .lane[data-lane='js'] .lane-track::after {
  opacity: 1;
}

.lane output {
  text-align: right;
}

.block-btn {
  position: relative;
  margin-top: 20px;
  height: 52px;
  padding: 0 22px;
  background: var(--navy);
  color: var(--white);
  font-weight: 500;
  overflow: hidden;
}

/* A fill that drains while the block lasts, and snaps back when it ends. */
.block-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgb(255 98 89 / 0.85);
  clip-path: inset(0 100% 0 0);
  transition: clip-path 200ms var(--ease-out);
}

.block-btn[data-blocked='true']::after {
  clip-path: inset(0 0 0 0);
  transition: clip-path 4000ms linear;
}

.block-btn span {
  position: relative;
  z-index: 1;
}

.honest {

  font-size: 14px;

/* ---------- Ending: measured from the Reanimated docs ---------- */

    margin-top: 24px;
  }

  .hire-cta {
    height: 52px;
    margin-top: 32px;
    font-size: 17px;
  }

  .sponsor {
    margin-top: 28px;
  }

  .site-footer {
    gap: 16px;
    padding-block: 24px;
    font-size: 13.5px;
  }

  .notes-toggle {
    right: 8px;
    bottom: 8px;
    height: 28px;
    padding: 0 8px;
    font-size: 12px;
    opacity: 0.85;
  }

  .notes-toggle span {
    display: none;
  }

  /* The copy takes what it needs, and the example fills the rest of the screen. */
  .chapter,
  .chapter[data-flip] {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    padding: 30px var(--gutter) 0;
  }

  /* The options always come first, so the example is never what pushes them away. */
  .chapter[data-flip] .chapter-stage {
    order: 1;
  }

  .chapter-copy {
    padding-bottom: 10px;
  }

  .chapter-stage {
    flex: 1;
    align-self: auto;
    width: auto;
    height: auto;
    min-height: 300px;
    margin: 0 calc(-1 * var(--gutter) + 8px);
  }

  .kicker {
    margin-bottom: 6px;
    font-size: 11.5px;
  }

  .title {
    font-size: min(8vw, 32px);
  }

  .body {
    margin-top: 8px;
    font-size: 15px;
    line-height: 1.4;
  }

  .chapter[data-compact] .body {
    display: none;
  }

  /* Dragging covers the index; the options that change the example stay. */
  .chapter-copy > .chips-label,
  .chips[aria-label='Snap to detent'] {
    display: none;
  }

  /* Each row of options is one swipeable line. */
  .chips {
    flex-wrap: nowrap;
    margin: 12px calc(-1 * var(--gutter)) 0;
    padding: 0 var(--gutter);
    overflow-x: auto;
    scrollbar-width: none;
  }

  .chips::-webkit-scrollbar {
    display: none;
  }

  .chip {
    flex: none;
    height: 36px;
  }

  .modes {
    display: grid;
    gap: 6px;
    margin-top: 10px;
  }

  .modes > div {
    display: flex;
    align-items: center;
    min-width: 0;
  }

  .modes .chips-label {
    flex: none;
    width: 66px;
    margin: 0;
  }

  .modes .chips {
    flex: 1;
    margin: 0;
    padding: 0;
  }

  .trace,
  .lanes {
    margin-top: 10px;
    box-shadow: none;
  }

  .trace canvas {
    height: 56px;
  }

  .trace-legend {
    padding: 6px 10px;
    font-size: 11px;
  }

  .lane {
    grid-template-columns: 92px minmax(0, 1fr) 40px;
    padding: 8px 10px;
    font-size: 11.5px;
  }

  .block-btn {
    margin-top: 10px;
    height: 44px;
    width: 100%;
  }

  .honest {
    margin-top: 6px;
    font-size: 12.5px;
    line-height: 1.35;
  }

  .code-actions {
    order: 0;
    margin-top: 8px;
  }

  .code-actions--solo {
    justify-content: flex-end;
  }

  .docs-button {
    height: 34px;
    padding: 0 12px;
    font-size: 13.5px;
  }

  /* Opening the code shrinks the example, so both stay on the screen. */
  .code-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    font-size: 13.5px;
    font-weight: 500;
  }

  .code-collapse {
    display: grid;
    grid-template-rows: 0fr;
    visibility: hidden;
    transition:
      grid-template-rows 260ms var(--ease-out),
      visibility 0s linear 260ms;
  }

  .code-block[data-open='true'] .code-collapse {
    grid-template-rows: 1fr;
    visibility: visible;
    transition-delay: 0s;
  }

  .code-collapse-inner {
    min-height: 0;
    overflow: hidden;
  }

  .code-collapse .code {
    margin-top: 8px;
    max-height: 32svh;
    overflow: auto;
    padding: 10px 12px;
    font-size: 12px;
    line-height: 1.5;
    box-shadow: none;
  }
}

/* A short phone keeps a smaller frame, so the section and the next sheet still fit. */
@media (max-width: 860px) and (max-height: 720px) {
  .chapter-stage {
    min-height: 244px;
  }
}

/* ---------- Reduced motion: fades stay, travel goes ---------- */

@media (prefers-reduced-motion: reduce) {
  .hero-copy > * {
    animation-name: fade;
  }

  .hint {
    animation: none;
  }

  .reveal[data-in='false'] {
    transform: none;
  }

  .lane-track::before {
    animation: none;
  }

  [data-direction] > .roll-in {
    animation-name: fade;
  }

  [data-direction] > .roll-out {
    animation: none;
    display: none;
  }

  .tick,
  .reopen,
  .swap-item,
  .code-collapse {
    transition-duration: 1ms;
  }

  .swap-item {
    filter: none;
  }
}

@keyframes fade {
  from {
    opacity: 0;
  }
}
