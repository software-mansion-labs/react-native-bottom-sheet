buildscript {
  ext.ReactNativeBottomSheet = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36,
    targetSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return ReactNativeBottomSheet[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

android {
  namespace "com.swmansion.reactnativebottomsheet"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
    targetSdkVersion getExtOrDefault("targetSdkVersion")
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    // Ships the keep rule for the reflectively-resolved JSTouchDispatcher overload (see
    // JSTouchDispatcherCompat.kt) to consuming apps' R8/ProGuard.
    consumerProguardFiles "proguard-rules.pro"
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable "GradleCompatible"
  }

  testOptions {
    unitTests {
      includeAndroidResources = true
    }

    unitTests.all {
      // React Native configures compilation for JDK 17, while Robolectric's API 36
      // sandbox requires JDK 21. Use the newer JDK only for the test worker.
      javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
      }

      jvmArgs += [
        "--add-opens=java.base/java.lang=ALL-UNNAMED",
        "--add-opens=java.base/java.util=ALL-UNNAMED",
        "--add-opens=java.base/java.io=ALL-UNNAMED",
        "--add-opens=java.base/java.net=ALL-UNNAMED",
        "--add-opens=java.base/java.security=ALL-UNNAMED",
        "--add-opens=java.base/java.text=ALL-UNNAMED",
        "--add-opens=java.base/jdk.internal.access=ALL-UNNAMED",
        "--add-opens=java.desktop/java.awt.font=ALL-UNNAMED",
        "--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED",
      ]
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "androidx.activity:activity:1.8.2"
  implementation "androidx.core:core:1.8.0"
  implementation "androidx.dynamicanimation:dynamicanimation:1.0.0"

  androidTestImplementation "androidx.test:runner:1.7.0"
  androidTestImplementation "androidx.test:core:1.7.0"
  androidTestImplementation "androidx.test.ext:junit:1.3.0"

  testImplementation "androidx.test.ext:junit:1.3.0"
  testImplementation "junit:junit:4.13.2"
  testImplementation "org.robolectric:robolectric:4.16.1"
}
