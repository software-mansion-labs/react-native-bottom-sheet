name: Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:js
      - run: bun run prepare
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: bun run test:android:prepare
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: bun run test:android:unit
      - run: bun run test:android:instrumented:assemble
  android-instrumented:
    name: Android instrumented tests (API ${{ matrix.api-level }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        api-level: [35, 36]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: bun run test:android:prepare
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          enable-hw-keyboard: true
          script: bun run test:android:instrumented
  ios-native-tests:
    name: iOS native tests
    needs: check
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      IOS_TEST_RUNTIME_IDENTIFIER: com.apple.CoreSimulator.SimRuntime.iOS-18-5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Run iOS native tests
        run: bun run test:ios:native
      - name: Upload iOS native failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-test-results
          path: |
            .bundle/ios-native-results/*.log
            .bundle/ios-native-results/*.xcresult
          include-hidden-files: true
          if-no-files-found: warn
